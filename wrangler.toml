name = "scientific-article-portal"
main = "app.py"
compatibility_date = "2026-11-12"
compatibility_flags = ["python_workers"]

[vars]
ENVIRONMENT = "production"

# Cloudflare R2 Bucket bog'lanishi (fayllar uchun)
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "scientific-article"

# Cloudflare D1 Database bog'lanishi (baza uchun)
[[d1_databases]]
binding = "DB"
database_name = "scholar-db"
database_id = "14567560-9991-4401-882c-52d0bc3d636a"

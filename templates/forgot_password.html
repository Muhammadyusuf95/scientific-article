<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash - SciPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .auth-card { background: white; border-radius: 1.5rem; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-primary { background-color: #2563eb; border: none; padding: 0.75rem; font-weight: 600; border-radius: 50rem; }
        .form-control { border-radius: 50rem; padding: 0.75rem 1.25rem; background-color: #f8fafc; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fas fa-key fa-3x text-primary mb-2"></i>
            <h3 class="fw-bold text-dark">Parolni tiklash</h3>
            <p class="text-muted small">Hisobingiz uchun yangi parol o'rnating</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Foydalanuvchi nomi" required>
            </div>
            <div class="mb-4">
                <input type="password" name="new_password" class="form-control" placeholder="Yangi parol" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 shadow-sm text-white">Parolni yangilash</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Kirish sahifasiga qaytish</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

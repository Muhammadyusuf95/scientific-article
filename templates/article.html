<head>
    <meta charset="UTF-8">
    <title>{{ article.title_uz }}</title>
    
    <!-- Google Scholar & Highwire Press Meta Tags -->
    <meta name="citation_title" content="{{ article.title_uz }}">
    {% for author in article.authors %}
    <meta name="citation_author" content="{{ author.full_name }}">
    {% endfor %}
    <meta name="citation_publication_date" content="{{ article.year }}/{{ article.issue or '01' }}/01">
    <meta name="citation_journal_title" content="{{ collection.name if collection else 'Ilmiy Maqolalar Portali' }}">
    <meta name="citation_volume" content="{{ article.volume }}">
    <meta name="citation_issue" content="{{ article.issue }}">
    <meta name="citation_firstpage" content="{{ article.pages.split('-')[0] if article.pages else '1' }}">
    <meta name="citation_lastpage" content="{{ article.pages.split('-')[-1] if article.pages else '1' }}">
    <meta name="citation_pdf_url" content="{{ article.pdf_filename }}">
    <meta name="citation_doi" content="{{ article.doi }}">
    <meta name="citation_abstract_html_url" content="{{ request.url }}">
    <meta name="citation_language" content="uz">
    <meta name="citation_keywords" content="{{ article.keywords_uz }}">
</head>

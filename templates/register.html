<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - SciPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .auth-card { background: white; border-radius: 1.5rem; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-success-custom { background-color: #10b981; border: none; padding: 0.75rem; font-weight: 600; border-radius: 50rem; color: white; }
        .btn-success-custom:hover { background-color: #059669; color: white; }
        .form-control { border-radius: 50rem; padding: 0.75rem 1.25rem; background-color: #f8fafc; border: 1px solid #e2e8f0; }
        .form-control:focus { box-shadow: none; border-color: #10b981; background-color: #fff; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-3x text-success mb-2"></i>
            <h3 class="fw-bold text-dark">Ro'yxatdan o'tish</h3>
            <p class="text-muted small">Ilmiy portaldan foydalanish uchun hisob oching</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Foydalanuvchi nomi" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="Parol yarating" required>
            </div>
            <button type="submit" class="btn btn-success-custom w-100 shadow-sm">Ro'yxatdan o'tish</button>
        </form>

        <div class="text-center mt-4 small">
            <span class="text-muted">Hisobingiz bormi?</span> 
            <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold text-primary">Tizimga kirish</a>
        </div>
        <div class="text-center mt-2">
            <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
